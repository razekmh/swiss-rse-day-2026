<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 556 286" width="556" height="286">
  <style>
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 14% { transform: scaleY(1); }
      16% { transform: scaleY(0.08); }
      19% { transform: scaleY(1); }
      21.5% { transform: scaleY(0.08); }
      25%, 100% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye { animation: none; }
    }
  </style>
