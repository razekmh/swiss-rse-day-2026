<script>
  (function () {
    var root = document.querySelector(".rse-timeline");
    if (!root || typeof Reveal === "undefined") return;

    var train = root.querySelector(".rse-train");
    var hereLabel = root.querySelector(".rse-here-label");
    var stopsEl = root.querySelector(".rse-stops");
    var inset = "var(--rse-inset)";
    var labelGap = 10;

    function slideName(slide) {
      if (slide.classList.contains("quarto-title-block")) return "";
      var heading = slide.querySelector("h1, h2, h3, .title");
      return heading ? heading.textContent.replace(/\s+/g, " ").trim() : "";
    }

    function isMajor(slide) {
      return (
        slide.classList.contains("quarto-title-block") ||
        slide.classList.contains("level1")
      );
    }

    function place(i, n) {
      if (n <= 1) return "50%";
      return (
        "calc(" + inset + " + (100% - 2 * " + inset + ") * " + i / (n - 1) + ")"
      );
    }

    function build(slides) {
      stopsEl.innerHTML = "";
      slides.forEach(function (slide, i) {
        var li = document.createElement("li");
        var name = slideName(slide);
        li.style.left = place(i, slides.length);
        li.dataset.name = name;
        if (isMajor(slide) && name) {
          li.classList.add("is-major");
          var span = document.createElement("span");
          span.textContent = name;
          li.appendChild(span);
        }
        stopsEl.appendChild(li);
      });
    }

    // Hide station names that would overlap. The current station always
    // keeps its name; the rest are kept left to right while they fit.
    function declutter(current) {
      var spans = stopsEl.querySelectorAll("li.is-major span");
      var mine = current.querySelector("span");
      var kept = [];
      spans.forEach(function (span) {
        span.classList.remove("is-crowded");
      });
      if (mine) kept.push(mine.getBoundingClientRect());
      spans.forEach(function (span) {
        if (span === mine) return;
        var r = span.getBoundingClientRect();
        var clash = kept.some(function (k) {
          return r.left < k.right + labelGap && r.right + labelGap > k.left;
        });
        if (clash) span.classList.add("is-crowded");
        else kept.push(r);
      });
    }

    function sync() {
      var slides = Reveal.getSlides();
      if (!slides.length) return;
      if (stopsEl.children.length !== slides.length) build(slides);
      var index = slides.indexOf(Reveal.getCurrentSlide());
      if (index < 0) index = 0;
      var at = Math.min(index, slides.length - 1);
      var left = place(at, slides.length);
      train.style.left = left;
      hereLabel.style.left = left;
      var stops = stopsEl.querySelectorAll("li");
      stops.forEach(function (stop, n) {
        stop.classList.toggle("is-on", n <= at);
        stop.classList.toggle("is-here", n === at);
      });
      var current = stops[at];
      var name = current.dataset.name || "";
      var namedOnTheRail = current.classList.contains("is-major");
      declutter(current);
      hereLabel.textContent = name;
      hereLabel.classList.toggle("is-hidden", namedOnTheRail || !name);
    }

    function mountHero() {
      var title = document.querySelector(".quarto-title-block");
      if (!title || title.querySelector(".rse-hero")) return;
      var img = document.createElement("img");
      img.className = "rse-hero";
      img.src = "figures/logo_outline.svg";
      img.alt = "RSE Swiss";
      title.insertBefore(img, title.firstChild);
    }

    Reveal.on("ready", function () {
      mountHero();
      sync();
    });
    Reveal.on("slidechanged", sync);
    Reveal.on("resize", sync);
    if (document.fonts) document.fonts.ready.then(sync);
  })();
</script>
<script src="life-map.js"></script>
